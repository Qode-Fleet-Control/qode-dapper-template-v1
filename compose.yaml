# compose.yaml — the app as a container: the fleet's docker runtime.
#
# The fleet runs every app as containers, in the coordinator's private docker (sysbox
# docker-in-docker): fleet.conf's DOCKER_* commands run this — `docker compose build`, then
# `docker compose up` in the FOREGROUND. Locally: `PORT=3000 bin/run`, or just
# `docker compose up --build`.
#
# This project serves no HTTP, so nothing is published and DOCKER_START_CMD is empty, the
# same as START_CMD: `bin/run` builds the image and stops there. Run the job with
# `docker compose run --rm app`.
#
# The workspace's shared services (Postgres, Redis, MinIO, Mailpit) are reachable from the
# container under the SAME hostnames the fleet injects: on each run the fleet attaches them
# to the private docker's network. The variables below are listed WITHOUT values, so compose
# passes the fleet's own through as is (and leaves out any that are unset). This works on
# compose's own network only, not a bare `docker run`.
services:
  app:
    build: .
    environment:
      # the app's public hostname / origin
      FLEET_APP_HOST:
      FLEET_APP_URL:
      # the workspace's shared services, from the fleet
      DATABASE_URL:
      PGHOST:
      PGPORT:
      PGUSER:
      PGPASSWORD:
      PGDATABASE:
      REDIS_URL:
      S3_ENDPOINT:
      S3_BUCKET:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_REGION:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_URL:
      # this app's own settings
      SQLITE_PATH:

  # A Postgres for LOCAL work only — never started on the fleet (which brings its own and
  # injects DATABASE_URL). Try the Postgres path with:
  #   docker compose --profile local up -d db
  #   DATABASE_URL=postgres://app:app@db:5432/app docker compose run --rm app
  db:
    image: postgres:16-alpine
    profiles: ["local"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
